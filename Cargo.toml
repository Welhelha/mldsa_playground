[package]
name = "mldsa-playground"
version = "0.1.0"
edition = "2021"

[features]
default = ["mldsa"]
mldsa = ["askar-crypto/mldsa"]

[dependencies]
askar-crypto = { git = "https://github.com/Welhelha/askar", rev = "561e1bc0579d3ef51f3163b447b366bd6abd9875" }

## rev = "561e1bc0579d3ef51f3163b447b366bd6abd9875" for hedged and "8f61827b4b5d40be81d1267456721dcc1868c198" for deterministic

[dev-dependencies]
base64 = "0.23.1"
sha2 = "0.11.1"

[[test]]
name = "mldsa"
path = "tests/mldsa.rs"
required-features = ["mldsa"]
